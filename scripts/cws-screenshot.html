<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CWS screenshot 1280x800</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #d8ddd6;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .stage {
        display: flex;
        width: 1280px;
        height: 800px;
      }
      .browser {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #fff;
      }
      .chrome {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 14px;
        background: #f1f3ef;
        border-bottom: 1px solid #d5d9d2;
        color: #5c5c5c;
        font-size: 12px;
      }
      .dots span {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #c9cdc6;
        margin-right: 4px;
      }
      .url {
        flex: 1;
        background: #fff;
        border: 1px solid #d5d9d2;
        border-radius: 14px;
        padding: 5px 12px;
        color: #333;
      }
      .page {
        flex: 1;
        padding: 48px 56px;
        color: #1a1a1a;
      }
      .page h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      .page p {
        margin: 0 0 10px;
        color: #444;
        font-size: 16px;
        line-height: 1.5;
      }
      .price {
        font-size: 22px;
        font-weight: 700;
        color: #2d6a4f;
      }
      .popup-col {
        width: 452px;
        background: #cfd6cc;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 16px 0;
        border-left: 1px solid #b7bfb4;
      }
      iframe {
        width: 420px;
        height: 768px;
        border: 0;
        border-radius: 8px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="browser">
        <div class="chrome">
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="url">shop.example/stand</div>
        </div>
        <div class="page">
          <h1>원목 모니터 스탠드</h1>
          <p>책상용 원목 스탠드. 높이 조절 가능.</p>
          <p class="price">32,000원</p>
          <p>배송비 3,000원</p>
        </div>
      </div>
      <div class="popup-col">
        <iframe src="cws-screenshot-popup.html" title="Page2Books popup"></iframe>
      </div>
    </div>
  </body>
</html>
